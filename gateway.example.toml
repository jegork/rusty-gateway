[server]
listen     = ":8080"
public_url = "https://gw.example"
data_dir   = "/data"     # gateway state such as upstream oauth credentials

[auth]
# OIDC issuer (Authelia, Keycloak, ...). Tokens must be JWTs with aud = audience.
issuer           = "https://auth.example"
required_scope   = "mcp:use"
# tokens must carry aud = public_url or public_url + "/mcp/{namespace}";
# audience adds one more accepted value if your IdP uses a fixed name
# audience       = "mcp-gateway"
# optional: env var holding a static bearer token for scripts and bootstrapping
static_token_env = "GATEWAY_STATIC_TOKEN"

[audit]
path           = "/data/audit.db"
retention_days = 90
max_payload_kb = 8

[limits]
call_timeout                 = "60s"   # per tool call, queue time included
max_concurrent               = 32      # gateway-wide; 0 = unlimited
max_concurrent_per_namespace = 16
max_concurrent_per_server    = 4

[breaker]
failures = 5      # consecutive transport errors/timeouts before opening; 0 disables
cooldown = "30s"  # then one trial call is let through

[[namespace]]
name      = "personal"
servers   = ["tradingview", "hevy"]
discovery = "search"     # full (default): every server__tool
                         # connector: {server}__list_tools + {server}__call per server
                         # search: search_tools + call_tool for the namespace

[[namespace]]
name           = "ops"
servers        = ["dokploy", "remote-example"]
max_concurrent = 4          # overrides limits.max_concurrent_per_namespace

[servers.tradingview]
command = "/usr/local/bin/uvx"
args    = ["--from", "tradingview-mcp-server", "tradingview-mcp"]
env     = { UV_CACHE_DIR = "/var/cache/uv", MARKETAUX_API_TOKEN = "${MARKETAUX_API_TOKEN}" }

[servers.hevy]
command = "/usr/local/bin/hevy-mcp"
env     = { HEVY_API_KEY = "${HEVY_API_KEY}" }

[servers.dokploy]
command = "/usr/local/bin/dokploy-mcp"
env     = { DOKPLOY_URL = "${DOKPLOY_URL}", DOKPLOY_API_KEY = "${DOKPLOY_API_KEY}" }

# remote streamable HTTP upstream; headers are sent on every request
[servers.remote-example]
url            = "https://mcp.example.com/mcp"
headers        = { Authorization = "Bearer ${REMOTE_MCP_TOKEN}" }
max_concurrent = 2      # overrides limits.max_concurrent_per_server
call_timeout   = "120s" # overrides limits.call_timeout

# remote upstream that requires oauth: the gateway logs in once via the
# browser and refreshes tokens from then on. on startup the log prints the
# url to open; re-trigger any time with
#   curl -H "Authorization: Bearer $GATEWAY_STATIC_TOKEN" https://gw.example/oauth/upstream/personal/notion/login
# registration uses the gateway's client metadata
# document, falling back to dynamic registration; set oauth_client_id (and
# oauth_client_secret_env) for servers that require a pre-registered client.
[servers.notion]
url   = "https://mcp.notion.com/mcp"
oauth = true

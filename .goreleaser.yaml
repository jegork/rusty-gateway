version: 2
project_name: gateway
builds:
  - main: ./cmd/gateway
    binary: gateway
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, gateway.example.toml]
checksum:
  name_template: checksums.txt
changelog:
  disable: true
release:
  # release-please already created the release with notes; only attach assets
  mode: keep-existing
